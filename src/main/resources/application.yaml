server:
  port: 8080

spring:
  application:
    name: donaton-bff

  # ── Microsoft Entra ID (Azure) Ñembopyahu ───────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # Reprocesávo, remoĩta ne Azure Tenant ID mba'erã
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:AQUI_VA_TU_TENANT_ID}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:AQUI_VA_TU_TENANT_ID}/discovery/v2.0/keys
  spring:
    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:AQUI_VA_TU_TENANT_ID}/v2.0
            jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:AQUI_VA_TU_TENANT_ID}/discovery/v2.0/keys
            audiences: ${AZURE_BACKEND_CLIENT_ID:api://AQUI_VA_TU_BACKEND_CLIENT_ID}
# ── CORS Ñembopyahu Frontend-pe guarã ─────────────────────────────
app:
  cors:
    allowed-origins: "http://localhost:5173"

# ── URLs de Microservicios ────────────────────────────────────────────────────
donaton:
  ms:
    logistica:
      url: http://localhost:8082
    necesidades:
      url: http://localhost:8083
    donaciones:
      url: http://localhost:8081

# ── Resilience4j ──────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      logisticaCB:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
      necesidades:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.donaton: DEBUG
    org.springframework.web.client: DEBUG
    org.springframework.security: DEBUG

